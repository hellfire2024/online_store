# Production-ready nginx.conf for React/Vite SPA (unprivileged)
worker_processes  auto;
error_log  /tmp/error.log warn;
pid        /tmp/nginx.pid;

# Events
events {
    worker_connections  1024;
}

# HTTP
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression for JS/CSS/HTML assets
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/javascript application/json
                      application/xml application/xml+rss image/svg+xml font/woff font/woff2;

    # Temp directories for unprivileged nginx
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    
    server {
        listen       8080;
        server_name  dev.adaptivegis.com;
        root   /usr/share/nginx/html;
        index  index.html;
        # Explicit health endpoint for container platforms (Coolify/Traefik).
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }
        # Content-Security-Policy: allow Square Web Payments SDK iframes, scripts, fonts, and connections.
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval'
                https://sandbox.web.squarecdn.com
                https://web.squarecdn.com
                https://js.squareup.com
                https://www.paypal.com
                https://js.stripe.com
                https://js.braintreegateway.com
                https://jstest.authorize.net
                https://js.authorize.net;
            style-src 'self' 'unsafe-inline'
                https://fonts.googleapis.com
                https://sandbox.web.squarecdn.com
                https://web.squarecdn.com;
            font-src 'self' data:
                https://fonts.gstatic.com
                https://sandbox.web.squarecdn.com
                https://web.squarecdn.com
                https://pci-connect.squareupsandbox.com
                https://pci-connect.squareup.com;
            frame-src 'self'
                https://sandbox.web.squarecdn.com
                https://web.squarecdn.com
                https://pci-connect.squareupsandbox.com
                https://pci-connect.squareup.com
                https://www.paypal.com
                https://js.stripe.com;
            connect-src 'self'
                https://pci-connect.squareupsandbox.com
                https://pci-connect.squareup.com
                https://sandbox.web.squarecdn.com
                https://web.squarecdn.com
                https://api.stripe.com
                https://www.paypal.com
                https://api-m.sandbox.paypal.com
                https://api-m.paypal.com
                https://apitest.authorize.net
                https://api.authorize.net
                https://jstest.authorize.net
                https://js.authorize.net
                https://api2.authorize.net;
            img-src 'self' data: blob: https:;
            media-src 'self';
            object-src 'none';
        " always;

        location / {
            try_files $uri $uri/ /index.html;
        }
        # Proxy API requests to backend (preserve /api prefix)
        # Proxy all /api* requests to backend (handles /api, /api/, /api/admin-users, etc)
        location ^~ /api {
            proxy_pass http://backend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
