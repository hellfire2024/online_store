version: '3.8'

services:
  backend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${PROD_API_DOMAIN}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=3001"
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=10s"
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3002:3001"
    environment:
      NODE_ENV: production
      DEMO_MODE: "0"
      PORT: 3001
      CORS_ORIGIN: https://${PROD_FRONTEND_DOMAIN}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_URL_BACKEND: https://${PROD_API_DOMAIN}
      SERVICE_URL_FRONTEND: https://${PROD_FRONTEND_DOMAIN}
      SERVICE_URL_PHPMYADMIN: https://${PROD_PHPMYADMIN_DOMAIN}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${PROD_FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.interval=10s"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8889:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      SERVICE_URL_BACKEND: https://${PROD_API_DOMAIN}
      SERVICE_URL_FRONTEND: https://${PROD_FRONTEND_DOMAIN}
      SERVICE_URL_PHPMYADMIN: https://${PROD_PHPMYADMIN_DOMAIN}

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Disabled by default in production.
  # Enable only if needed, and protect it with IP allow-listing or private access.
  phpmyadmin:
    profiles: ["tools"]
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      SERVICE_URL_BACKEND: https://${PROD_API_DOMAIN}
      SERVICE_URL_FRONTEND: https://${PROD_FRONTEND_DOMAIN}
      SERVICE_URL_PHPMYADMIN: https://${PROD_PHPMYADMIN_DOMAIN}
    depends_on:
      - mysql
    command: /bin/sh -c "echo 'ServerName ${PROD_PHPMYADMIN_DOMAIN}' >> /etc/apache2/apache2.conf && docker-php-entrypoint apache2-foreground"

volumes:
  mysql_data:
