
version: '3.8'
services:
  backend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`devapi.adaptivegis.com`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=3001"
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=10s"
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3001:3001"
    # Removed env_file. All environment variables are now defined directly below for Coolify visibility.
    environment:
      SERVICE_URL_BACKEND: https://devapi.adaptivegis.com
      SERVICE_URL_FRONTEND: https://dev.adaptivegis.com
      SERVICE_URL_PHPMYADMIN: https://devmysql.adaptivegis.com
      NODE_ENV: production
      DEMO_MODE: "0"
      PORT: 3001
      CORS_ORIGIN: https://dev.adaptivegis.com
      SKIP_DB_CHECK: ""
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: adaptivegis-dev
      DB_PASSWORD: we1r9dveIPTzjJ84HMD6
      DB_NAME: agis_dev_db
      JWT_SECRET: 2b1e7e2e-4c6a-4e2b-8c7e-7e2e4c6a8c7e-2026-02-12
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
  frontend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`dev.adaptivegis.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    environment:
      SERVICE_URL_BACKEND: https://devapi.adaptivegis.com
      SERVICE_URL_FRONTEND: https://dev.adaptivegis.com
      SERVICE_URL_PHPMYADMIN: https://devmysql.adaptivegis.com
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: adaptivegis-dev
      PMA_PASSWORD: we1r9dveIPTzjJ84HMD6
      SERVICE_URL_BACKEND: https://devapi.adaptivegis.com
      SERVICE_URL_FRONTEND: https://dev.adaptivegis.com
      SERVICE_URL_PHPMYADMIN: https://devmysql.adaptivegis.com
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "curl", "-f", "https://devapi.adaptivegis.com/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    command: /bin/sh -c "echo 'ServerName devmysql.adaptivegis.com' >> /etc/apache2/apache2.conf && docker-php-entrypoint apache2-foreground"
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: agis_dev_db
      MYSQL_USER: adaptivegis-dev
      MYSQL_PASSWORD: we1r9dveIPTzjJ84HMD6
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend-src/db/migrations:/docker-entrypoint-initdb.d:ro
volumes:
  mysql_data:


