
version: '3.8'
services:
  backend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-dev.rule=Host(`${SERVICE_URL_BACKEND_HOST}`)"
      - "traefik.http.routers.backend-dev.entrypoints=websecure"
      - "traefik.http.routers.backend-dev.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-dev.service=backend-dev"
      - "traefik.http.services.backend-dev.loadbalancer.server.port=3001"
      - "traefik.http.services.backend-dev.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.backend-dev.loadbalancer.healthcheck.interval=10s"
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3001:3001"
    # All secrets are injected by Coolify — never hardcode values here
    environment:
      SERVICE_URL_BACKEND: ${SERVICE_URL_BACKEND}
      SERVICE_URL_FRONTEND: ${SERVICE_URL_FRONTEND}
      SERVICE_URL_PHPMYADMIN: ${SERVICE_URL_PHPMYADMIN}
      APP_ENV: dev
      EXPECTED_DB_TAG: dev
      NODE_ENV: production
      DEMO_MODE: "0"
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 300s
  frontend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-dev.rule=Host(`${SERVICE_URL_FRONTEND_HOST}`)"
      - "traefik.http.routers.frontend-dev.entrypoints=websecure"
      - "traefik.http.routers.frontend-dev.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-dev.service=frontend-dev"
      - "traefik.http.services.frontend-dev.loadbalancer.server.port=8080"
      - "traefik.http.services.frontend-dev.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.frontend-dev.loadbalancer.healthcheck.interval=10s"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      SERVICE_URL_BACKEND: ${SERVICE_URL_BACKEND}
      SERVICE_URL_FRONTEND: ${SERVICE_URL_FRONTEND}
      SERVICE_URL_PHPMYADMIN: ${SERVICE_URL_PHPMYADMIN}
  # phpMyAdmin: disabled by default. Enable only when needed and restrict to private access.
  # phpmyadmin:
  #   profiles: ["tools"]
  #   image: phpmyadmin/phpmyadmin
  #   ...
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
