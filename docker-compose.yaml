
version: '3.8'
services:
  backend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`devapi.adaptivegis.com`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=3001"
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=10s"
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=adaptivegis-dev
      - DB_PASSWORD=we1r9dveIPTzjJ84HMD6
      - DB_NAME=agis_dev_db
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "echo 'PWD:' $(pwd); echo 'Files:'; ls -al; echo 'ENVIRONMENT VARIABLES:'; printenv; echo 'DB_HOST='$DB_HOST; chmod +x /app/backend-src/wait-for-mysql.sh /app/backend-src/healthcheck-debug.sh; /app/backend-src/wait-for-mysql.sh npm start & /app/backend-src/healthcheck-debug.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

# Pre-deploy cleanup: forcibly remove frontend/backend containers/images (never MySQL)
x-pre-deploy:
  image: docker:cli
  entrypoint: ["/bin/sh", "-c"]
  command:
    - |
      echo "Removing frontend/backend containers/images (MySQL untouched)...";
      docker ps -a --format '{{.Names}}' | grep -E 'frontend|backend' | xargs -r docker rm -f;
      docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | grep -E 'frontend|backend' | awk '{print $2}' | xargs -r docker rmi -f;
      echo "Cleanup done."
  # This service is not started, but can be run manually or as a pre-step in CI/CD

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: agis_dev_db
      MYSQL_USER: adaptivegis-dev
      MYSQL_PASSWORD: we1r9dveIPTzjJ84HMD6
    ports:
      - "3306:3306"

  frontend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`dev.adaptivegis.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8888:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


